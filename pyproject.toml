[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-chat-ocr"
version = "0.1.0"
description = "Local macOS OCR archive tool for one-to-one WeChat chats"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6",
  "pyobjc-framework-Cocoa",
  "pyobjc-framework-Quartz",
  "pyobjc-framework-ApplicationServices",
  "Pillow",
  "numpy",
  "rapidfuzz",
  "Jinja2",
  "pynput",
]

[project.scripts]
wechat-chat-ocr = "wechat_archive.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["wechat_archive*"]
